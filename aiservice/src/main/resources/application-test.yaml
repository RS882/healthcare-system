spring:
  application:
    name: ai-service-test

  config:
    import: ""

  cloud:
    config:
      enabled: false
      fail-fast: false
    discovery:
      enabled: false

  cache:
    type: redis

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3:latest

cache:
  default-ttl: 5m
  active-prompt:
    ttl: 10m

ai:
  provider: ollama
  model: llama3:latest

  prompt:
    activation-retry:
      max-attempts: 3
      initial-delay: 1ms
      multiplier: 1.0
      max-delay: 1ms

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false